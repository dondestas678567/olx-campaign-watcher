name: OLX campaigns monitor

on:
  # GitHub cron runs in UTC.
  # Romania:
  # - winter (EET, UTC+2): 10:00 local ~= 08:00 UTC
  # - summer (EEST, UTC+3): 10:00 local ~= 07:00 UTC
  # Using both keeps you close to 10:00 year-round.
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Persist "seen links" across runs so you don't get "everything is new" daily.
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            aura_links_updating_every_run.json
          key: olx-state-${{ github.run_id }}
          restore-keys: |
            olx-state-

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          ls -al
          python send_olx_campaigns_to_mail.py
